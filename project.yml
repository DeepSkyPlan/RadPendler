# XcodeGen spec for the RadPendler iOS app (the .xcodeproj is generated, not committed):
#   xcodegen generate
# Versioning as in VORSim/DeepFrame: MARKETING_VERSION minor = feature, patch = fix;
# CURRENT_PROJECT_VERSION rises on every upload and never resets.

name: RadPendler
options:
  bundleIdPrefix: de.keese
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.7.0"
    CURRENT_PROJECT_VERSION: "13"
    SWIFT_VERSION: "5.0"

targets:
  RadPendler:
    type: application
    platform: iOS
    sources:
      - path: RadPendler
        excludes:
          - "Resources/**"
      - path: RadPendler/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.keese.radpendler
        GENERATE_INFOPLIST_FILE: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "RadPendler"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: "5PX3V6L522"
        CODE_SIGN_STYLE: Automatic

  # HAFAS parsing, time arithmetic, the bike+rail composition and the rain
  # assessment are the parts that can be wrong quietly — a train without bike
  # carriage or a missed day rollover still renders as a plausible row.
  RadPendlerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RadPendlerTests
        excludes:
          - "Fixtures/**"
      - path: RadPendlerTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: RadPendler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.keese.radpendler.tests
        GENERATE_INFOPLIST_FILE: "YES"
        DEVELOPMENT_TEAM: "5PX3V6L522"

schemes:
  RadPendler:
    build:
      targets:
        RadPendler: all
        RadPendlerTests: [test]
    run:
      config: Debug
    test:
      targets:
        - RadPendlerTests
