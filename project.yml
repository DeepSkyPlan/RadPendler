# XcodeGen spec for the RadPendler iOS app (the .xcodeproj is generated, not committed):
#   xcodegen generate
# Versioning as in VORSim/DeepFrame: MARKETING_VERSION minor = feature, patch = fix;
# CURRENT_PROJECT_VERSION rises on every upload and never resets.

name: RadPendler
options:
  bundleIdPrefix: de.keese
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "32"
    SWIFT_VERSION: "5.0"

targets:
  RadPendler:
    type: application
    platform: iOS
    sources:
      - path: RadPendler
        excludes:
          - "Resources/**"
      - path: RadPendler/Resources
        buildPhase: resources
      - path: Shared
    dependencies:
      # The watch app rides inside the phone app, as watchOS wants it.
      - target: RadPendlerWatch
        embed: true
        copy:
          destination: wrapper
          subpath: Watch
    # Adressen und Einstellungen wandern über den iCloud-Schlüssel-Wert-Speicher
    # zwischen iPhone und iPad; der Plan selbst geht weiter direkt an die Uhr.
    entitlements:
      path: RadPendler/RadPendler.entitlements
      properties:
        # Auch die Kennzahlen der gefahrenen Fahrten reisen hierüber — nur die
        # Zahlen, nie die Linien: der Speicher fasst 1 MB für die ganze App.
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        # Die Linien der Fahrten (TrackCloud). Container und Zuordnung stehen
        # seit 24.09.2026 im Portal; der Datensatztyp legt sich beim ersten
        # Hochladen selbst an. Fürs Ausliefern muss das Schema danach im
        # CloudKit-Dashboard einmal von Development nach Production.
        #
        # **Wer hier etwas ändert, braucht ein Profil mit diesem Container.**
        # Die Xcode-Team-Profile auf diesem Mac sind älter als der Container
        # und kennen ihn nicht; automatisches Signieren nimmt nur Xcode-eigene
        # Profile und kann sie ohne angemeldetes Konto nicht auffrischen.
        # Einmal aus Xcode.app bauen zieht sie nach — danach geht alles wieder
        # von der Kommandozeile. Build 29 wurde ersatzweise mit von Hand über
        # die API erzeugten Profilen signiert („RadPendler AppStore CK" und
        # „RadPendlerWatch AppStore CK"); die stehen im Portal und können weg,
        # sobald Xcode die eigenen erneuert hat.
        com.apple.developer.icloud-container-identifiers: [iCloud.org.afjk.radpendler]
        com.apple.developer.icloud-services: [CloudKit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.keese.radpendler
        GENERATE_INFOPLIST_FILE: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "RadPendler"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # One fix on demand, never a trail: the app asks only when "Mein
        # Standort" is tapped and forgets the manager afterwards.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Für „Mein Standort“ als Startadresse — einmal abgefragt, in eine Adresse übersetzt, nicht gespeichert. Und, wenn du eine Fahrt aufzeichnest, für die Strecke, die Geschwindigkeit und die Ampelhalts dieser Fahrt: nur zwischen „Fahrt aufzeichnen“ und „Fahrt beenden“, und nur in deine eigene iCloud."
        # UIBackgroundModes gibt es nicht als INFOPLIST_KEY_*; die Teil-Datei
        # wird von Xcode mit den erzeugten Schlüsseln zusammengeführt. Sie
        # enthält genau einen Eintrag: den Hintergrundmodus für die
        # Aufzeichnung einer Fahrt (nur zwischen Start und Ende aktiv,
        # RideTracker schaltet ihn selbst wieder ab).
        INFOPLIST_FILE: RadPendlerInfo.plist
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # iPad turns every way up; the layout follows the size class, not the device.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # The plan is one picture — it wants the whole screen, not a window
        # beside something else. Opts out of the iPadOS window manager.
        INFOPLIST_KEY_UIRequiresFullScreen: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: "5PX3V6L522"
        CODE_SIGN_STYLE: Automatic

  # watchOS 10 and later: one target, no extension. The app shows the plan the
  # phone computed and counts down to it; it plans nothing itself, because
  # MapKit directions and the radar tiles do not exist on the watch.
  RadPendlerWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: RadPendlerWatch
        excludes:
          - "Resources/**"
      - path: RadPendlerWatch/Resources
        buildPhase: resources
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.keese.radpendler.watchkitapp
        GENERATE_INFOPLIST_FILE: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: "RadPendler"
        INFOPLIST_KEY_WKApplication: "YES"
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: de.keese.radpendler
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: "NO"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        DEVELOPMENT_TEAM: "5PX3V6L522"
        CODE_SIGN_STYLE: Automatic

  # HAFAS parsing, time arithmetic, the bike+rail composition and the rain
  # assessment are the parts that can be wrong quietly — a train without bike
  # carriage or a missed day rollover still renders as a plausible row.
  RadPendlerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RadPendlerTests
        excludes:
          - "Fixtures/**"
      - path: RadPendlerTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: RadPendler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.keese.radpendler.tests
        GENERATE_INFOPLIST_FILE: "YES"
        DEVELOPMENT_TEAM: "5PX3V6L522"

  # Only there to drive the App Store screenshots: it taps its way through the
  # app and keeps every frame. Its own scheme, because it needs the network and
  # takes minutes — `./dev test` must stay fast.
  RadPendlerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RadPendlerUITests
    dependencies:
      - target: RadPendler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.keese.radpendler.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        DEVELOPMENT_TEAM: "5PX3V6L522"

schemes:
  RadPendler:
    build:
      targets:
        RadPendler: all
        RadPendlerTests: [test]
    run:
      config: Debug
    test:
      targets:
        - RadPendlerTests

  RadPendlerShots:
    build:
      targets:
        RadPendler: all
        RadPendlerUITests: [test]
    test:
      targets:
        - RadPendlerUITests
